name: Publish TVmaze to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'quickstart/**'
      - '.github/workflows/deploy-tvmaze.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: quickstart
    steps:
      - name: Check out the project
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quickstart/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watch=false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build TVmaze
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/" --output-path dist/github-pages
      - name: Upload the compiled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: quickstart/dist/github-pages/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy TVmaze
        id: deployment
        uses: actions/deploy-pages@v4
